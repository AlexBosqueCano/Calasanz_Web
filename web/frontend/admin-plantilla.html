<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Añadir Jugador - CD. CALASANZ</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .form-admin { max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #006400; color: white; padding: 10px 20px; border: none; cursor: pointer; width: 100%; font-weight: bold; }
        optgroup { font-style: normal; font-weight: bold; color: #006400; }
    </style>
</head>
<body>
    <header>
        <img src="escudo.jpg" alt="Escudo" style="width: 50px;">
        <h1>Administración CD. CALASANZ</h1>
    </header>

    <div class="form-admin">
        <h2>Registrar Nuevo Fichaje</h2>
        <form id="form-nuevo-jugador">
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label>Primer Apellido:</label>
                <input type="text" id="ap1" required>
            </div>
            <div class="form-group">
                <label>Segundo Apellido:</label>
                <input type="text" id="ap2">
            </div>
            <div class="form-group">
                <label>Posición:</label>
                <select id="posicion">
                    <option value="Portero">Portero</option>
                    <option value="Defensa">Defensa</option>
                    <option value="Centrocampista">Centrocampista</option>
                    <option value="Delantero">Delantero</option>
                </select>
            </div>
            <div class="form-group">
                <label>Asignar a Equipo:</label>
                <select id="equipo" required>
                    <option value="">Selecciona un equipo...</option>
                    <optgroup label="Juvenil">
                        <option value="1">Juvenil A</option>
                        <option value="2">Juvenil B</option>
                        <option value="3">Juvenil C</option>
                    </optgroup>
                    <optgroup label="Cadete">
                        <option value="4">Cadete A</option>
                        <option value="5">Cadete B</option>
                    </optgroup>
                    <optgroup label="Infantil">
                        <option value="6">Infantil A</option>
                    </optgroup>
                </select>
            </div>
            <button type="submit">Guardar Jugador</button>
        </form>
    </div>

    <script src="main.js"></script>
</body>
</html>
