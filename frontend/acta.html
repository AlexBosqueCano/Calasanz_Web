<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD. Calasanz Santander / Acta del Partido</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- layout.js rellena la cabecera y el pie (menú, sesión, tema) -->
    <header></header>

    <main class="main-flex">
        <section class="page-hero-equipos hero-compacto">
            <div class="container equipos-hero-inner">
                <div>
                    <a href="equipos.html" id="acta-volver" class="link-arrow enlace-volver"><span aria-hidden="true">←</span> Volver al equipo</a>
                    <div class="kicker">
                        <span class="kicker-line"></span>
                        <span>FICHA OFICIAL DE ENCUENTRO</span>
                    </div>
                    <h1 class="display-title titulo-hero titulo-hero-pequeno">Acta del Partido</h1>
                    <p class="lead-text lead-sin-margen">Alineación, equipo arbitral, cronología de goles, sustituciones y amonestaciones.</p>
                </div>

                <div class="bars-graphic" aria-hidden="true">
                    <div class="bar-1"></div>
                    <div class="bar-2"></div>
                    <div class="bar-3"></div>
                    <div class="bar-4"></div>
                    <div class="bar-5"></div>
                    <div class="bar-gold"></div>
                </div>
            </div>
        </section>

        <section class="equipos-band">
            <div class="container">
                <!-- Aquí aparecen los errores de carga -->
                <div id="acta-mensajes"></div>

                <!-- acta.js rellena todo lo que hay dentro de #acta-contenido (GET /api/partidos/{id}) -->
                <div id="acta-contenido" hidden>
                    <div class="acta-meta-bar">
                        <div class="acta-competicion-badge"><span id="acta-competicion"></span></div>
                        <div id="acta-fecha"></div>
                    </div>

                    <div class="acta-grid acta-grid-2">
                        <!-- COLUMNA 1: marcador, árbitros, goles -->
                        <div class="acta-col-card">
                            <div class="acta-scoreboard" id="acta-marcador"></div>

                            <div class="acta-block" id="acta-bloque-lugar" hidden>
                                <div class="acta-block-title acta-titulo-izq">Lugar</div>
                                <p class="acta-estadio" id="acta-lugar"></p>
                            </div>

                            <div class="acta-block" id="acta-bloque-arbitros" hidden>
                                <div class="acta-block-title">Árbitros</div>
                                <div class="acta-rows" id="acta-arbitros"></div>
                            </div>

                            <div class="acta-block" id="acta-bloque-goles" hidden>
                                <div class="acta-block-title">Goles</div>
                                <div class="acta-rows" id="acta-goles"></div>
                            </div>

                            <div class="acta-block" id="acta-bloque-cronica" hidden>
                                <a class="link-arrow" id="acta-enlace-cronica" href="noticias.html"><span>Leer la crónica del partido </span><span aria-hidden="true">→</span></a>
                            </div>
                        </div>

                        <!-- COLUMNA 2: nuestro equipo (del rival solo se guarda marcador y goles) -->
                        <div class="acta-col-card" id="acta-equipo-propio" hidden>
                            <div class="acta-team-header"><span id="acta-nombre-propio"></span></div>

                            <div class="acta-block">
                                <div class="acta-block-title">Titulares</div>
                                <div class="acta-rows" id="acta-titulares"></div>
                            </div>
                            <div class="acta-block">
                                <div class="acta-block-title">Suplentes</div>
                                <div class="acta-rows" id="acta-suplentes"></div>
                            </div>
                            <div class="acta-block" id="acta-bloque-delegados" hidden>
                                <div class="acta-block-title">Cuerpo Técnico</div>
                                <div class="acta-rows" id="acta-delegados"></div>
                            </div>
                            <div class="acta-block" id="acta-bloque-sustituciones" hidden>
                                <div class="acta-block-title">Sustituciones</div>
                                <div id="acta-sustituciones"></div>
                            </div>
                            <div class="acta-block" id="acta-bloque-tarjetas" hidden>
                                <div class="acta-block-title">Tarjetas</div>
                                <div class="acta-rows" id="acta-tarjetas"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <!-- ORDEN IMPORTANTE: cada script usa los anteriores -->
    <script src="api.js"></script>
    <script src="session.js"></script>
    <script src="layout.js"></script>
    <script src="datos-demo.js"></script>
    <script src="acta-util.js"></script>
    <script src="acta.js"></script>
</body>
</html>
