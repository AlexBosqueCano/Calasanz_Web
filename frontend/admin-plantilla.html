<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD. Calasanz Santander / Panel de gestión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body data-roles="COORDINADOR,DESARROLLADOR">
    <!-- layout.js rellena la cabecera y el pie (menú, sesión, tema) -->
    <header></header>

    <main class="main-flex">
        <section class="page-hero-equipos hero-compacto">
            <div class="container equipos-hero-inner">
                <div>
                    <div class="kicker">
                        <span class="kicker-line"></span>
                        <span>ÁREA TÉCNICA Y COORDINACIÓN</span>
                    </div>
                    <h1 class="display-title titulo-hero titulo-hero-pequeno">Panel de gestión deportiva</h1>
                    <p class="lead-text lead-sin-margen">Alta, edición y baja de jugadores de cada plantilla.</p>
                </div>

                <div class="bars-graphic" aria-hidden="true">
                    <div class="bar-1"></div>
                    <div class="bar-2"></div>
                    <div class="bar-3"></div>
                    <div class="bar-4"></div>
                    <div class="bar-5"></div>
                    <div class="bar-gold"></div>
                </div>
            </div>
        </section>

        <section class="equipos-band">
            <div class="container">
                <div class="tabs-nav" role="tablist" aria-label="Secciones del panel">
                    <button type="button" class="filter-pill admin-tab active" role="tab" id="admin-tab-1" data-target="tab-crud-plantilla" aria-controls="tab-crud-plantilla" aria-selected="true">Gestión de plantilla</button>
                </div>

                <!-- PESTAÑA 1: ALTA, EDICIÓN Y BAJA DE JUGADORES -->
                <div id="tab-crud-plantilla" class="tab-pane active" role="tabpanel" aria-labelledby="admin-tab-1">
                    <div class="admin-grid-2">
                        <!-- Formulario de alta / edición -->
                        <div class="news-card">
                            <div>
                                <div class="news-card-meta">
                                    <span>JUGADOR</span>
                                    <span id="modo-form-label">Alta nueva</span>
                                </div>
                                <h2 class="titulo-tarjeta">Añadir o editar jugador</h2>

                                <form id="form-jugador" novalidate>
                                    <div class="field-group">
                                        <label for="j-equipo">Equipo</label>
                                        <!-- admin.js rellena las opciones desde la API -->
                                        <select id="j-equipo" required><option>Cargando…</option></select>
                                    </div>

                                    <div class="field-group">
                                        <label for="j-nombre">Nombre</label>
                                        <input type="text" id="j-nombre" class="clean-input" maxlength="50" autocomplete="off" required>
                                    </div>

                                    <div class="grid-2-cols">
                                        <div class="field-group">
                                            <label for="j-ap1">Primer apellido</label>
                                            <input type="text" id="j-ap1" class="clean-input" maxlength="100" autocomplete="off" required>
                                        </div>
                                        <div class="field-group">
                                            <label for="j-ap2">Segundo apellido (opcional)</label>
                                            <input type="text" id="j-ap2" class="clean-input" maxlength="100" autocomplete="off">
                                        </div>
                                    </div>

                                    <div class="grid-dorsal">
                                        <div class="field-group">
                                            <label for="j-dorsal">Dorsal (1-99)</label>
                                            <input type="number" id="j-dorsal" class="clean-input" min="1" max="99" inputmode="numeric" required>
                                        </div>
                                        <div class="field-group">
                                            <label for="j-posicion">Posición</label>
                                            <select id="j-posicion" required>
                                                <option value="Portero">Portero</option>
                                                <option value="Defensa">Defensa</option>
                                                <option value="Centrocampista" selected>Centrocampista</option>
                                                <option value="Delantero">Delantero</option>
                                            </select>
                                        </div>
                                    </div>

                                    <!-- Mensajes de resultado (role="status": se leen en voz alta al aparecer) -->
                                    <p id="crud-feedback" class="feedback" role="status" hidden></p>

                                    <div class="fila-botones">
                                        <button type="submit" class="btn-green boton-ancho"><span class="btn-texto">Guardar jugador</span> <span aria-hidden="true">→</span></button>
                                        <button type="button" id="btn-cancelar-edicion" class="btn-outline" hidden>Cancelar</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Tabla de jugadores con acciones -->
                        <div>
                            <table class="modern-table">
                                <caption class="solo-lectores">Jugadores del equipo seleccionado</caption>
                                <thead>
                                    <tr>
                                        <th scope="col">Dorsal</th>
                                        <th scope="col">Jugador</th>
                                        <th scope="col">Posición</th>
                                        <th scope="col">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-admin-jugadores"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Las actas, partidos y crónicas se gestionan ahora en el panel del entrenador -->
                <p class="acta-etiqueta">¿Buscas las actas? Ahora están en el <a href="panel-entrenador.html" class="enlace-subrayado">panel del entrenador</a>.</p>
            </div>
        </section>
    </main>

    <footer></footer>

    <!-- ORDEN IMPORTANTE: cada script usa los anteriores -->
    <script src="api.js"></script>
    <script src="session.js"></script>
    <script src="layout.js"></script>
    <script src="datos-demo.js"></script>
    <script src="admin.js"></script>
</body>
</html>
