<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD. Calasanz Santander / Equipos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- layout.js rellena la cabecera y el pie (menú, sesión, tema) -->
    <header></header>

    <main class="main-flex">
        <section class="page-hero-equipos">
            <div class="container equipos-hero-inner">
                <div>
                    <div class="kicker"><span>FÚTBOL BASE · CALASANZ</span></div>
                    <h1 class="display-title titulo-hero">Equipos del club</h1>
                    <p class="lead-text lead-sin-margen">Selecciona una categoría para consultar su plantilla, resultados, actas y estadísticas.</p>
                </div>

                <div class="bars-graphic" aria-hidden="true">
                    <div class="bar-1"></div>
                    <div class="bar-2"></div>
                    <div class="bar-3"></div>
                    <div class="bar-4"></div>
                    <div class="bar-5"></div>
                    <div class="bar-gold"></div>
                </div>
            </div>
        </section>

        <section class="equipos-band">
            <div class="container">
                <div class="filter-bar">
                    <!-- equipos.js crea aquí los botones de categoría a partir de los datos -->
                    <div class="filter-pills" id="filtros-categoria" role="group" aria-label="Filtrar por categoría"></div>
                    <span class="teams-counter" id="contador-equipos"></span>
                </div>

                <!-- equipos.js pinta aquí una tarjeta por equipo -->
                <div class="teams-grid" id="lista-equipos">
                    <p class="texto-vacio">Cargando equipos…</p>
                </div>

                <div class="equipos-footnote">
                    <span><span aria-hidden="true">ⓘ</span> Entra en cada equipo para consultar su información deportiva.</span>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <!-- ORDEN IMPORTANTE: cada script usa los anteriores -->
    <script src="api.js"></script>
    <script src="session.js"></script>
    <script src="layout.js"></script>
    <script src="datos-demo.js"></script>
    <script src="equipos.js"></script>
</body>
</html>
