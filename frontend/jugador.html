<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de jugador - CD. Calasanz</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="equipos" data-requiere-sesion>

    <main id="contenido" tabindex="-1">
        <section aria-labelledby="nombre-perfil-principal">
            <h1 id="nombre-perfil-principal">Cargando jugador…</h1>

            <p class="selector-temporada">
                Temporada: <strong class="temporada-actual">2025-2026</strong>
            </p>

            <div class="perfil-jugador">
                <div class="perfil-foto">
                    <!-- Imagen decorativa: alt vacío para que no la lean los lectores de pantalla -->
                    <img src="escudo.jpg" alt="">
                </div>
                <div class="perfil-info">
                    <h2>Ficha técnica</h2>
                    <ul id="lista-ficha-tecnica">
                        <li>Cargando datos…</li>
                    </ul>
                </div>
            </div>

            <hr>
            <h2>Estadísticas de la temporada 2025-2026</h2>
            <div class="tabla-contenedor">
                <table class="plantilla-tabla">
                    <caption class="solo-lectores">Estadísticas del jugador en la temporada</caption>
                    <thead>
                        <tr>
                            <th scope="col"><abbr title="Partidos jugados">PJ</abbr></th>
                            <th scope="col">Titular</th>
                            <th scope="col">Suplente</th>
                            <th scope="col">Minutos</th>
                            <th scope="col">Goles</th>
                            <th scope="col">Asist.</th>
                            <th scope="col"><abbr title="Tarjetas amarillas">TA</abbr></th>
                            <th scope="col"><abbr title="Tarjetas rojas">TR</abbr></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-estadisticas-jugador">
                        <tr><td colspan="8" class="celda-centrada">Cargando…</td></tr>
                    </tbody>
                </table>
            </div>

            <p><a href="juvenil-a-plantilla.html">Volver a la plantilla</a></p>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="session.js"></script>
    <script src="layout.js"></script>
    <script src="main.js"></script>
</body>
</html>
