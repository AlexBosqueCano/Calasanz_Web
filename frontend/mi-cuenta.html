<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD. Calasanz Santander / Mi cuenta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- layout.js rellena la cabecera y el pie (menú, sesión, tema) -->
    <header></header>

    <main class="main-flex">
        <section class="page-hero-equipos hero-compacto">
            <div class="container equipos-hero-inner">
                <div>
                    <div class="kicker">
                        <span class="kicker-line"></span>
                        <span>TU CUENTA</span>
                    </div>
                    <h1 class="display-title titulo-hero titulo-hero-pequeno">Mi cuenta</h1>
                    <p class="lead-text lead-sin-margen">Tus datos de acceso y la seguridad de tu contraseña.</p>
                </div>

                <div class="bars-graphic" aria-hidden="true">
                    <div class="bar-1"></div>
                    <div class="bar-2"></div>
                    <div class="bar-3"></div>
                    <div class="bar-4"></div>
                    <div class="bar-5"></div>
                    <div class="bar-gold"></div>
                </div>
            </div>
        </section>

        <section class="equipos-band">
            <div class="container">
                <div id="cuenta-mensajes"></div>

                <div class="admin-grid-2">
                    <div class="news-card">
                        <div>
                            <div class="news-card-meta"><span>DATOS</span><span id="mc-rol"></span></div>
                            <h2 class="titulo-tarjeta">Mis datos</h2>
                            <p class="news-card-texto"><strong>Usuario:</strong> <span id="mc-usuario"></span></p>
                            <p class="news-card-texto"><strong>Correo:</strong> <span id="mc-email"></span></p>
                            <p class="acta-etiqueta">Si necesitas cambiar tu usuario o tu correo, escribe a coordinación desde la página de contacto.</p>
                        </div>
                    </div>

                    <div class="news-card" id="password">
                        <div>
                            <div class="news-card-meta"><span>SEGURIDAD</span></div>
                            <h2 class="titulo-tarjeta">Cambiar contraseña</h2>
                            <form id="mc-form" novalidate>
                                <div id="mc-errores" class="mensaje mensaje-error" role="alert" hidden></div>
                                <div class="field-group">
                                    <label for="mc-actual">Contraseña actual</label>
                                    <input type="password" id="mc-actual" name="password_actual" class="clean-input" autocomplete="current-password" required>
                                </div>
                                <div class="field-group">
                                    <label for="mc-nueva">Contraseña nueva (10-128 caracteres)</label>
                                    <input type="password" id="mc-nueva" name="password_nueva" class="clean-input" autocomplete="new-password" minlength="10" maxlength="128" required>
                                </div>
                                <div class="field-group">
                                    <label for="mc-repetir">Repite la contraseña nueva</label>
                                    <input type="password" id="mc-repetir" name="repetir" class="clean-input" autocomplete="new-password" required>
                                </div>
                                <p id="mc-feedback" class="feedback" role="status" hidden></p>
                                <div class="fila-botones">
                                    <button type="submit" class="btn-green boton-ancho"><span class="btn-texto">Cambiar contraseña</span> <span aria-hidden="true">→</span></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <!-- ORDEN IMPORTANTE: cada script usa los anteriores -->
    <script src="api.js"></script>
    <script src="session.js"></script>
    <script src="layout.js"></script>
    <script src="datos-demo.js"></script>
    <script src="panel-util.js"></script>
    <script src="mi-cuenta.js"></script>
</body>
</html>
